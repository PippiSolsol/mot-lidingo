<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
</head><body>
<style>/* Layout: one app column (max 760px). Sticky header carries the tabs on wide screens; on phones the tabs dock to the bottom like a native app. */
:root {
  --bg: #EDF2F0; --surface: #FFFFFF; --surface-2: #E3EAE8; --ink: #13202A; --ink-2: #43535B; --muted: #66787E; --line: #D1DBD9;
  --run: #2F7D4F; --swim: #2F5FC6; --open: #00957F; --race: #C98F00; --test: #C4497E; --rest: #9AA7AB;
  --ph0: #98A2A7; --ph1: #6DAA5C; --ph2: #D9A92E; --ph3: #5A97D6; --ph4: #E2834B;
  --bad: #C2413A;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E161A; --surface: #162127; --surface-2: #1E2B31; --ink: #E6EEEE; --ink-2: #B0BFC2; --muted: #879A9F; --line: #2A3940;
    --run: #48A56E; --swim: #6390E6; --open: #14A88E; --race: #C2900E; --test: #D46A98; --rest: #5F6E73;
    --ph0: #7D888D; --ph1: #5E9B50; --ph2: #C49A2A; --ph3: #4F88C4; --ph4: #CF7743;
    --bad: #E06A60;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E161A; --surface: #162127; --surface-2: #1E2B31; --ink: #E6EEEE; --ink-2: #B0BFC2; --muted: #879A9F; --line: #2A3940;
  --run: #48A56E; --swim: #6390E6; --open: #14A88E; --race: #C2900E; --test: #D46A98; --rest: #5F6E73;
  --ph0: #7D888D; --ph1: #5E9B50; --ph2: #C49A2A; --ph3: #4F88C4; --ph4: #CF7743;
  --bad: #E06A60;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.k-run { --k: var(--run); } .k-swim { --k: var(--swim); } .k-open { --k: var(--open); }
.k-race { --k: var(--race); } .k-test { --k: var(--test); } .k-rest { --k: var(--rest); }

/* Header + tabs */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-in { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: flex; flex-direction: column; line-height: 1; }
.brand b { font-family: var(--display); font-weight: 800; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; }
.brand small { font-size: 12px; color: var(--muted); margin-top: 4px; letter-spacing: .02em; }
.next-chip { font-size: 13px; color: var(--ink-2); text-align: right; line-height: 1.2; }
.next-chip strong { font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--ink); }
.tabs { display: flex; gap: 4px; }
.tab { border: 0; background: transparent; padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.tab svg { width: 18px; height: 18px; flex: none; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.top .next-chip { display: none; }
@media (max-width: 759px) {
  .top .next-chip { display: block; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
    padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); justify-content: space-around; }
  .tab { flex: 1; flex-direction: column; gap: 2px; font-size: 11px; padding: 6px 4px; border-radius: 12px; }
  .tab[aria-selected="true"] { background: var(--surface-2); color: var(--ink); }
}

/* Status line: where logs are saved, and looking at another day */
.proto { max-width: 760px; margin: 12px auto 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.proto-in { font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
.proto-in b { color: var(--ink); font-weight: 600; }
.linkish { background: none; border: 0; padding: 0; color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.proto-tools { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-top: 4px; }
.proto-tools input[type=date] { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 8px; }
.pill { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
@media (hover: hover) { .pill:hover { border-color: var(--ink-2); } }
.pill.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.store-note { color: var(--muted); }
.tools-note { flex-basis: 100%; margin: 0; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

main { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 112px; display: flex; flex-direction: column; gap: 28px; }
@media (min-width: 760px) { main { padding-block: 20px 64px; } }

.sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-h h2 { font-family: var(--display); font-weight: 700; font-size: 26px; text-transform: uppercase; letter-spacing: .01em; line-height: 1.05; }
.sec-h .sub { color: var(--muted); font-size: 13px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.muted { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 7px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--k, var(--rest)) 16%, var(--surface)); color: var(--ink); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--k, var(--rest)); }
.badge { display: inline-flex; padding: 1px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border: 1px solid var(--line); color: var(--ink-2); background: var(--surface); }
.badge.light { background: color-mix(in srgb, var(--ph2) 22%, var(--surface)); border-color: transparent; color: var(--ink); }
.badge.race { background: color-mix(in srgb, var(--race) 30%, var(--surface)); border-color: transparent; color: var(--ink); }

/* Today hero */
.hero { border-radius: 22px; padding: 20px; display: grid; gap: 14px; background: color-mix(in srgb, var(--k, var(--rest)) 13%, var(--surface)); border: 1px solid color-mix(in srgb, var(--k, var(--rest)) 30%, var(--line)); position: relative; overflow: hidden; }
.hero-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.hero-title { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 9vw, 52px); line-height: .95; text-transform: uppercase; letter-spacing: .005em; }
.hero-desc { font-size: 16px; color: var(--ink-2); max-width: 60ch; }
.hero-foot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.big { font-family: var(--display); font-weight: 800; font-size: 68px; line-height: .85; letter-spacing: -.01em; }
.big small { font-size: 26px; font-weight: 700; margin-left: 4px; color: var(--ink-2); letter-spacing: 0; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 10px 16px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
@media (hover: hover) { .btn:hover { border-color: var(--ink-2); } }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
@media (hover: hover) { .btn.primary:hover { opacity: .9; } }
.btn svg { width: 16px; height: 16px; }
.hero-note { font-size: 13px; color: var(--ink-2); border-top: 1px solid color-mix(in srgb, var(--k, var(--rest)) 30%, var(--line)); padding-top: 12px; }
.hero-note b { color: var(--ink); }
.logged { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-weight: 600; }
.next-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); width: 100%; text-align: left; }
.next-row .t { font-weight: 600; }
.next-row .d { font-size: 13px; color: var(--muted); }
.head-sub { font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.btn.sm { padding: 7px 12px; font-size: 13px; }

/* Today + the next five days: one row per day, the day that matters right now as a big card */
.days { display: flex; flex-direction: column; gap: 8px; }
.days .hero { padding: 18px; gap: 12px; }
.days .hero-title { font-size: clamp(32px, 8.5vw, 44px); }
.days .hero .big { font-size: 56px; }
.dayrow { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; position: relative; overflow: hidden; }
.dayrow::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--k); }
.dayrow.today { box-shadow: inset 0 0 0 1px var(--ink); border-color: var(--ink); }
.dayrow.rest { background: transparent; border-style: dashed; }
.dayrow.rest::before { display: none; }
.dr-main { width: 100%; border: 0; background: transparent; text-align: left; display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px 14px 12px 17px; }
@media (hover: hover) { button.dr-main:hover { background: color-mix(in srgb, var(--k) 6%, transparent); } }
.dr-date { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.dr-date b { font-family: var(--display); font-weight: 700; font-size: 20px; text-transform: uppercase; line-height: 1; letter-spacing: .01em; }
.dr-date span { font-size: 12px; color: var(--muted); line-height: 1.2; }
.dr-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dr-t { font-weight: 700; font-size: 16px; line-height: 1.25; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.dr-x { font-size: 14px; color: var(--ink-2); line-height: 1.4; }
.dr-v { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; white-space: nowrap; }
.dr-v .num { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1; }
.dr-v small { font-size: 14px; color: var(--ink-2); margin-left: 2px; font-weight: 600; }
.dayrow.rest .dr-main { padding-block: 9px; align-items: center; }
.dayrow.rest .dr-date b { font-size: 17px; color: var(--ink-2); }
.dayrow.rest .dr-t { font-weight: 500; font-size: 14px; color: var(--muted); }
.dr-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 14px 12px 105px; }
.packs { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 2px; }
.packs .eyebrow { margin-right: 2px; }
.pk { font-size: 12px; font-weight: 600; line-height: 1.5; padding: 1px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink); }
.hero .pk { background: var(--surface); }
.wdiv { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 8px 2px 0; }
.wdiv::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.nudge { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--k); border-radius: 14px; padding: 10px 12px 10px 14px; font-size: 14px; }
@media (max-width: 420px) {
  .dr-main { grid-template-columns: 64px minmax(0, 1fr) auto; gap: 10px; padding-right: 12px; }
  .dr-date b { font-size: 18px; }
  .dr-actions { padding-left: 91px; }
}

/* The workout on the watch, step by step, exactly as it was sent to Garmin */
.watch-line { display: flex; align-items: center; gap: 8px; border: 0; background: transparent; padding: 0; text-align: left; font-size: 14px; color: var(--ink-2); }
.watch-line svg { width: 18px; height: 18px; flex: none; }
.watch-line b { color: var(--ink); font-weight: 600; }
@media (hover: hover) { .watch-line:hover b { text-decoration: underline; text-underline-offset: 3px; } }
.watch { display: flex; flex-direction: column; gap: 10px; }
.watch-h { display: flex; flex-direction: column; gap: 2px; }
.watch-h b { font-size: 16px; font-weight: 700; line-height: 1.25; }
.wsteps, .wsteps ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.ws { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; align-items: baseline; padding: 8px 12px 8px 10px; border-radius: 10px; background: var(--surface-2); border-left: 4px solid var(--line); }
.ws.work { background: color-mix(in srgb, var(--k) 12%, var(--surface)); border-left-color: var(--k); }
.ws-v { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.1; white-space: nowrap; }
.ws-b { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.ws-t { font-weight: 600; font-size: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.ws-n { font-size: 13px; line-height: 1.35; color: var(--ink-2); }
.ws-t .pk { background: var(--surface); }
.ws-rep { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 6px; }
.ws-x { display: flex; align-items: center; justify-content: center; border-radius: 10px; font-family: var(--display); font-weight: 800; font-size: 22px; background: color-mix(in srgb, var(--k) 24%, var(--surface)); }
@media (max-width: 420px) { .ws { grid-template-columns: 66px minmax(0, 1fr); } .ws-rep { grid-template-columns: 34px minmax(0, 1fr); } .ws-rep .ws { grid-template-columns: 58px minmax(0, 1fr); gap: 8px; } }

/* Week strip */
.strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
.day .wd { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.day .dn { font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1; }
.day .lane { width: 70%; height: 5px; border-radius: 3px; background: var(--k); }
.day.k-rest .lane { background: var(--line); }
.day .code { font-size: 10px; font-weight: 700; letter-spacing: .05em; color: var(--ink-2); }
.day .v { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; white-space: nowrap; }
.day .u { font-size: 10px; color: var(--muted); line-height: 1; }
.day .st { height: 18px; display: flex; align-items: center; justify-content: center; }
.day.today { border: 2px solid var(--ink); padding: 7px 1px 5px; }
.day.k-rest { background: transparent; }

.stmark { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.stmark svg { width: 12px; height: 12px; }
.stmark.done { background: var(--ink); color: var(--bg); }
.stmark.partial { background: linear-gradient(90deg, var(--ink) 50%, transparent 50%); border: 2px solid var(--ink); }
.stmark.missed { border: 2px solid var(--bad); color: var(--bad); }
.stmark.open { border: 1.5px dashed var(--muted); width: 14px; height: 14px; }

.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px 24px; }
.meter-h { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 6px; }
.meter-h span:first-child { font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.meter-h span:first-child::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--k); }
.meter { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--k) 18%, var(--surface-2)); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; background: var(--k); }

.focus { font-size: 15px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.focus b { color: var(--ink); }
.callout { border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); background: color-mix(in srgb, var(--bad) 7%, var(--surface)); border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.callout ol { margin: 6px 0 0; padding-left: 20px; }

/* Bibs (race countdowns) */
.bib { --hole: var(--bg); position: relative; border-radius: 10px; border: 1px solid var(--line); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
  background:
    radial-gradient(circle at 10px 10px, var(--hole) 3px, transparent 3.6px),
    radial-gradient(circle at calc(100% - 10px) 10px, var(--hole) 3px, transparent 3.6px),
    radial-gradient(circle at 10px calc(100% - 10px), var(--hole) 3px, transparent 3.6px),
    radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), var(--hole) 3px, transparent 3.6px),
    var(--surface); }
.bib .band { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink); background: color-mix(in srgb, var(--race) 26%, var(--surface)); margin: -4px 4px 6px; border-radius: 4px; padding: 3px 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bib .no { font-family: var(--display); font-weight: 800; font-size: 54px; line-height: .9; text-align: center; }
.bib .no.done { font-size: 34px; padding-block: 8px; }
.bib .lbl { font-size: 12px; color: var(--muted); text-align: center; }
.bibs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 420px) { .bibs .bib .no { font-size: 40px; } .bibs .bib { padding-inline: 8px; } }
.countdown { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; align-items: end; }
.countdown .big { font-size: 84px; }
.countdown .what { padding-bottom: 6px; }
.countdown .what b { display: block; font-family: var(--display); font-size: 26px; font-weight: 700; text-transform: uppercase; line-height: 1; }

.mile { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: var(--k); margin-top: 5px; box-shadow: 0 0 0 2px var(--surface); }

/* Plan */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
.stat .l { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat .v { font-family: var(--display); font-weight: 800; font-size: 34px; line-height: 1; margin-top: 4px; }

"dist":{"v":6,"unit":"km"},"kind":"run","lib":"LL"},{"date":"2027-09-22","title":"LÖP Lätt","desc":"Lätt","dist":{"v":4,"unit":"km"},"kind":"run","lib":"LL"},{"date":"2027-09-23","title":"SIM Återhämtning","desc":"800 m mycket lugnt, lossa upp","dist":{"v":800,"unit":"m"},"kind":"swim","lib":"SÅ"},{"date":"2027-09-24","title":"Vila","desc":"Hämta nummerlapp, packa, vila","dist":null,"kind":"rest","lib":null},{"date":"2027-09-25","title":"TÄVLING","desc":"TCS Lidingöloppet 30 km, 522 m stigning. Gå i de brantaste backarna, energi var 30-40 min. Kontrolltider: Fågelöudde 15 km före 16:35, Grönsta 20 km före 17:20, Sticklinge 23,8 km före 18:00, Tyktorp 27 km före 18:40. Sista startgrupp 14:30","dist":{"v":30,"unit":"km"},"kind":"race","lib":"TAV-lidingo"},{"date":"2027-09-26","title":"Vila","desc":"Vila. Två av fyra Klassiker-lopp klara","dist":null,"kind":"rest","lib":null}]}],"library":[{"code":"LL","name":"LÖP Lätt","syfte":"Aerob bas, återhämtning och löpekonomi. Det pass som bygger tåligheten.","upplagg":"Uppvärmning 5 min gång eller lätt jogg + rörlighet + hoppövningar. Sedan jämn lugn löpning 5-8 km. Avsluta med 3 min gång.","intensitet":"Zon 2, pratfart. Pulsen ska kännas låg hela vägen.","tips":"Hellre för långsamt än för fort. Dagen efter ett kvalitetspass är detta ett återhämtningspass, inte ett tempotest.","key":"LL"},{"code":"LK","name":"LÖP Kvalitet: fartlek","syfte":"Fartkänsla och variation utan att tömma benen.","upplagg":"10 min uppvärmning. 6-8×1 min fort / 1 min lugnt (lätta veckor: 6×30-45 s). 5 min nedvarvning. Totalt 5-8 km.","intensitet":"Zon 4 i de snabba bitarna, lugn jogg mellan.","tips":"Fart på känsla, ingen klocka behövs. Bra pass när benen är tunga men du ändå vill ha lite fart.","key":"LK-fartlek"},{"code":"LK","name":"LÖP Kvalitet: tempo","syfte":"Höjer tröskeln, gör 10 km-farten billigare.","upplagg":"10 min uppvärmning. 2×8 min, 3×8-10 min eller 3×2000 m i jämn fart med 2-3 min jogg mellan. 5 min nedvarvning. Totalt 7-9 km.","intensitet":"Zon 3-4, pratsvårt. Ungefär halvmaratontempo.","tips":"Starta försiktigt. Sista intervallen ska gå i samma fart som den första.","key":"LK-tempo"},{"code":"LK / LT","name":"LÖP Kvalitet: backar","syfte":"Löparstyrka och steg utan tunga stötar. Lidingö-specifikt.","upplagg":"10 min uppvärmning. 8-12×45-90 s uppför i hög ansträngning, gå ner mellan. 5 min nedvarvning. Totalt 7-10 km.","intensitet":"Zon 4-5 uppför, full återhämtning nedför.","tips":"Kort steg, hög frekvens, aktiva armar, blicken 10 m framåt. Backarna ersätter styrkepassen i det här programmet.","key":"LK-backar"},{"code":"LK","name":"LÖP Kvalitet: intervall","syfte":"Syreupptag och 10 km-fart.","upplagg":"10 min uppvärmning + 3 stegringar. 5×3 min, 6×800 m, 10×400 m, 5×1000 m eller 4×1200 m med jogg ungefär halva intervalltiden. 5 min nedvarvning. Totalt 7-9 km.","intensitet":"Zon 4-5, 10 km-ansträngning (400:or något snabbare).","tips":"Jämn fart i alla intervaller. Hellre en för lite än en för mycket.","key":"LK-intervall"},{"code":"LK","name":"LÖP Kvalitet: måltempo","syfte":"Lär kroppen Kungsholmen Runt-tempot.","upplagg":"10 min uppvärmning. 4-6×1000 m, 3×2000 m eller 2 km tempo + 4×1000 m i måltempo med 2-3 min jogg. 5 min nedvarvning. Totalt 8-10 km.","intensitet":"Måltempo = 5 km-testtempo + 10-15 s/km.","tips":"Lås farten på Garmin. Måltempot ska kännas kontrollerat i april, inte maximalt.","key":"LK-maltempo"},{"code":"LP","name":"LÖP Långpass","syfte":"Uthållighet och struktur för Kungsholmen och framför allt Lidingö.","upplagg":"Uppvärmning som vanligt. Jämn lugn löpning. Från 12 km gångpaus 1 min var 10:e minut. Över 90 min: dryck och energi var 30-40 min. Sista 2 km lugnt.","intensitet":"Zon 2, lugnt och jämnt. Ska kunna köras på tid och känsla utan tempo.","tips":"Från juli i kuperad terräng, gärna på Lidingö eller i Nackareservatet. Gå i de brantaste backarna, så ska du göra på tävlingen.","key":"LP"},{"code":"LT","name":"LÖP Terräng/backar","syfte":"Lidingö-specifik styrka och teknik.","upplagg":"Uppvärmning. Terrängfartlek 6-10×1-3 min fort på stig med lugn jogg mellan, eller backintervaller enligt ovan. Totalt 7-10 km.","intensitet":"Zon 4 i de snabba bitarna.","tips":"Öva nedförslöpning: korta steg, lätt framåtlutning, blicken långt fram. Det sparar lår på Lidingö.","key":"LT"},{"code":"TEST","name":"Testlopp 5 km","syfte":"Ger måltempo för Kungsholmen Runt.","upplagg":"2 km uppvärmning + 4 stegringar. 5 km så jämnt och hårt du kan, t.ex. parkrun (Haga lördag 09:30) eller en egen uppmätt slinga. Jogga 1 km ner.","intensitet":"Maximalt men jämnt. Första km ska inte vara snabbast.","tips":"10 km-måltempo = 5 km-tempo + 10-15 s/km. Skriv in tempot i Logg.","key":"TEST"},{"code":"TÄV","name":"Kungsholmen Runt 10 km (8 maj)","syfte":"Delmål nummer ett.","upplagg":"2 km uppvärmning + stegringar 20-30 min före start. Håll måltempo första 5 km, öka försiktigt sista 3 km. Dagarna före: lätt löpning, sömn och kolhydrater.","intensitet":"Jämnt, första km får inte bli snabbast.","tips":"Veckan efter är återhämtning. Simningen tar över direkt efter loppet.","key":"TAV-khr"},{"code":"SK / ST","name":"SIM Kurs / teknik","syfte":"Teknik före volym: andning, kroppsläge, långt armtag.","upplagg":"Simkurs måndag 19:00-19:30. Veckor utan kurs: eget teknikpass 30-40 min med 6×50 m drill/sim (fingerdrag, catch-up, enarmscrawl, bensparkar med platta) och 6-8×50 m lugn crawl med fokus på ett moment.","intensitet":"Lugnt. Teknikpass ska inte göra dig andfådd.","tips":"Simma gärna 20 min lugnt före kursen om bassängen är öppen. Ta med ett fokus från kursen till onsdagens pass.","key":"SK"},{"code":"SD","name":"SIM Distans","syfte":"Bygger den sammanhängande sträckan mot 3000 m.","upplagg":"200 m insim. Huvuddel: långa intervaller eller sammanhängande simning enligt Veckoplan (400 m i november till 3000 m i juni). 100-200 m lugn nedsim.","intensitet":"Jämn, lugn fart. Du ska kunna fortsätta när passet är slut.","tips":"Räkna armtag per 25 m. Färre armtag i samma fart är bättre teknik. Bilateral andning hela passet.","key":"SD"},{"code":"SI","name":"SIM Intervall","syfte":"Fart och uthållighet i simningen.","upplagg":"200 m insim. 10×50, 8×100, 6×200, 4×400 eller 3×800 m med 20-60 s vila enligt Veckoplan. 200 m lugn nedsim.","intensitet":"Något över distansfart, jämn genom hela serien.","tips":"Starta lugnt. Sista intervallen ska kännas som den första.","key":"SI"},{"code":"SÅ","name":"SIM Återhämtning","syfte":"Lossa upp och hålla känslan i vattnet.","upplagg":"1000-1500 m lugnt med blandade simsätt, drillar och enstaka 50 m pigga.","intensitet":"Mycket lugnt.","tips":"Under Lidingöfasen är det här veckans enda simpass och fungerar som återhämtning för löpbenen.","key":"SÅ"},{"code":"ÖV","name":"SIM Öppet vatten","syfte":"Vansbro-specifikt: våtdräkt, kyla, sighting, masstart, simma rakt.","upplagg":"Våtdräkt, badmössa i stark färg och boj. Börja med 10-15 min för att vänja dig vid kylan. Sikta var 6-10:e armtag (lyft bara ögonen), simma mot ett fast märke. Öva masstart på 50 m med sällskap. Distans enligt Veckoplan: 800 m i maj till 3000 m i slutet av juni.","intensitet":"Lugnt och kontrollerat. Rak linje slår hög fart.","tips":"Aldrig ensam. Testa nässkyddet här, inte på tävlingsdagen, och ta med en reserv. Platser i Stockholm: t.ex. Smedsuddsbadet eller Långholmen i Mälaren, Hellasgården. Från 14-16 °C.","key":"ÖV"},{"code":"TÄV","name":"Vansbrosimningen 3000 m (10 juli)","syfte":"Första Klassiker-loppet.","upplagg":"Första 2 km medströms i Vanån: håll höger längs banmarkeringen för att få hjälp av strömmen. Sista kilometern motströms i Västerdalälven: håll nära bryggorna där strömmen är svagast. Sju broar passeras, vattnet brukar vara 16-22 °C.","intensitet":"Lugn start i masstarten, hitta rytmen efter 200 m, spara krafter till sista kilometern.","tips":"Våtdräkt enligt årets regler (kontrollera på vansbrosimningen.se), nässkydd + reserv. Provsim i älven dagen före för att känna strömmen.","key":"TAV-vansbro"},{"code":"TÄV","name":"TCS Lidingöloppet 30 km (25 september)","syfte":"Andra Klassiker-loppet.","upplagg":"30 km kuperad terräng med 522 m stigning: ängar och grusvägar varvat med stigar och branta backar. Gå i de brantaste backarna. Energi var 30-40 min från start, dryck vid kontrollerna. Gångpaus enligt långpassrutinen.","intensitet":"Lugnt, zon 2 de första 20 km. Sista 10 km får kosta.","tips":"Kontrolltider (klocktid): Fågelöudde 15 km före 16:35, Grönsta 20 km före 17:20, Sticklinge Uddvägen 23,8 km före 18:00, Sticklinge Tyktorp 27 km före 18:40. Sista startgrupp 14:30. Kontrollera årets tider på lidingoloppet.se.","key":"TAV-lidingo"}],"milestones":[{"week":"v.47","date":"2026-11-22","text":"Första långpasset på 10 km inom taket"},{"week":"v.51","date":"2026-12-20","text":"800 m sammanhängande crawl"},{"week":"v.53","date":"2027-01-03","text":"1000 m sammanhängande crawl. Sista veckan med 10 km-tak"},{"week":"v.3","date":"2027-01-24","text":"Långpass 12 km, 1200 m sammanhängande crawl"},{"week":"v.7","date":"2027-02-21","text":"1500 m sammanhängande crawl"},{"week":"v.10","date":"2027-03-14","text":"Testlopp 5 km (lördag): sätter måltempo för Kungsholmen Runt"},{"week":"v.11","date":"2027-03-21","text":"2000 m sammanhängande crawl"},{"week":"v.14","date":"2027-04-11","text":"Långpass 15 km, längsta före Kungsholmen Runt"},{"week":"v.17","date":"2027-05-02","text":"2500 m sammanhängande crawl"},{"week":"v.18","date":"2027-05-09","text":"Kungsholmen Runt 10 km, lördag 8 maj"},{"week":"v.21","date":"2027-05-30","text":"Första passet i öppet vatten (våtdräkt, från 14 °C)"},{"week":"v.24","date":"2027-06-20","text":"3000 m sammanhängande i bassäng"},{"week":"v.25","date":"2027-06-27","text":"Genrep i öppet vatten 2500-3000 m"},{"week":"v.27","date":"2027-07-11","text":"Vansbrosimningen 3000 m, lördag 10 juli"},{"week":"v.31","date":"2027-08-08","text":"Långpass 18 km i terräng"},{"week":"v.35","date":"2027-09-05","text":"Långpass 24 km, programmets längsta"},{"week":"v.38","date":"2027-09-26","text":"TCS Lidingöloppet 30 km, lördag 25 september"}],"assumptions":["10 km-taket gäller till och med v.53 2026. Från v.1 2027 släpps det stegvis: långpasset växer med ungefär 1 km var annan vecka till 15 km i april, hålls på 12-15 km under Vansbrofasen och växer sedan 2 km per vecka till 24 km i början av september. Stäm av takten med fysioterapeuten.","Startnivå simning är satt till ungefär 500 m sammanhängande crawl. Ligger du högre, hoppa fram i kolumnen Längsta sim i Veckoplan och behåll passens struktur.","Simkursen (måndag 19:00-19:30) antas gå under terminerna, ungefär till och med v.50 i höst och från v.1 till v.22 i vår. Veckor utan kurs: eget teknikpass 30-40 min samma dag. Simmar du 20 min lugnt före kursen blir måndagen ett fullvärdigt pass.","Öppet vatten från v.21 (slutet av maj) när vattnet nått 14-16 °C, i våtdräkt. Blir våren kall: skjut öppet vatten en vecka och låt bassängen bära distansen, den ligger redan på 3000 m v.24.","Torsbyresan (torsdag till söndag kring nyår) och eventuell semester: byt pass 1:1 mot lätt löpning och simning där du är. Långpasset är det pass som prioriteras om bara ett pass hinns med.","Tävlingsdatumen är hämtade från arrangörernas webbplatser i oktober 2026. Kontrollera dem när anmälan öppnar och justera veckorna 18, 27 och 38 om något flyttas."],"principles":["Fem pass i veckan, högst ett pass per dag. Vilodagar torsdag och lördag. Aldrig två hårda dagar i rad.","Var fjärde vecka är lätt (ungefär 30 % lägre volym). Lätta veckor är markerade med gul veckotyp och är en del av programmet, inte något man tar igen.","Varje löppass börjar med 5 min gång eller lätt jogg, rörlighet (höftcirklar, utfall) och hoppövningar (2×10 hopp på stället, 2×10 skipp). Det är samma uppvärmning som i Midnattsloppet-planen.","Långpass från 12 km körs med gångpaus 1 min var 10:e minut. Från juli i kuperad terräng, och i de brantaste backarna går du. Det är tävlingstaktiken på Lidingö.","Intensitet: lätt = zon 2 och pratfart, tempo = zon 3-4 och pratsvårt, intervall = zon 4-5. Använd pulszonerna i Garmin och låt långpassen styras av tid och känsla, inte tempo.","Simning: teknik före volym. Räkna armtag per bassänglängd i distanspassen, simma bilateral andning och håll jämn fart i intervallerna. I öppet vatten är rak linje viktigare än hög fart.","När en vecka spricker, prioritera i denna ordning: 1) långpasset, 2) ett simpass, 3) kvalitetspasset, 4) resten. Gör aldrig om ett missat pass genom att dubbla nästa dag.","Lidingöfasen (juli till september) är programmets tyngsta period, med fyra löppass. Om kroppen protesterar: stryk fredagens lätta pass, inte långpasset."]}</script>

  function nextRow(d, label) {

      esc(sessionName(d)) + "</span> " + chip(d.kind) + '</span><span class="num" style="font-weight:600">' + esc(distStr(d.dist)) + "</span></button>";
  }

  function dayRow(d, t, o) {
    var rest = d.kind === "rest", n = daysBetween(t, d.date);
    var html = '<div class="dayrow k-' + d.kind + (rest ? " rest" : "") + (n === 0 ? " today" : "") + '">' +
      '<button class="dr-main" data-act="open-session" data-date="' + d.date + '">' +
      '<span class="dr-date"><b>' + esc(dayLabel(d.date, t)) + "</b><span>" + esc(n <= 1 ? fmtShort(d.date) : fmtDM(d.date)) + "</span></span>" +
      '<span class="dr-body"><span class="dr-t">' + esc(rest ? d.desc || "Vila" : sessionName(d)) + (rest ? "" : chip(d.kind)) + "</span>" +
      (!rest && d.desc ? '<span class="dr-x">' + esc(d.desc) + "</span>" : "") + (WATCH.skipped[d.date] ? '<span class="dr-x muted">Inte på klockan</span>' : "") + (o.pack ? packs(d) : "") + "</span>" +
      '<span class="dr-v">' + (d.dist ? '<span class="num">' + nf(d.dist.v) + "<small>" + d.dist.unit + "</small></span>" : "") + statusMark(d.date) + "</span></button>";
    if (o.log && !rest && !S.logs[d.date]) html += '<div class="dr-actions">' +
      (d.dist ? '<button class="btn primary sm" data-act="quick-done" data-date="' + d.date + '">' + IC.check + "Klart, " + esc(distStr(d.dist)) + "</button>" : "") +
      '<button class="btn sm" data-act="quick-missed" data-date="' + d.date + '">Missade</button></div>';
    return html + "</div>";
  }
  function gapRow(a, b, t) {
    return '<div class="dayrow rest"><div class="dr-main"><span class="dr-date"><b>' + esc(dayLabel(a, t)) + "</b><span>" + esc(a === b ? fmtShort(a) : "t.o.m. " + fmtDM(b)) + "</span></span>" +
      '<span class="dr-body"><span class="dr-t">' + (a < START ? "Före programstart" : "Efter programmet") + "</span></span><span></span></div></div>";
  }
  function weekDiv(w) { return '<div class="wdiv"><span>' + esc(w.label) + " · " + esc(w.phase) + "</span>" + weekBadge(w) + "</div>"; }
  function dayList(t, focus) {
    // "Packa" goes on the next session still to do, counted from the day in focus.
    var html = [], gap = [], from = focus || t, next = null;
    for (var j = 0; j < 6 && !next; j++) {
      var c = BY_DATE[addDays(t, j)];
      if (c && c.date >= from && c.kind !== "rest" && !S.logs[c.date]) next = c.date;
    }
    function flush() { if (gap.length) html.push(gapRow(gap[0], gap[gap.length - 1], t)); gap = []; }
    for (var i = 0; i < 6; i++) {
      var s = addDays(t, i), d = BY_DATE[s];
      if (!d) { gap.push(s); continue; }
      flush();
      if (i > 0 && d.di === 0) html.push(weekDiv(WEEKS[d.wi]));
      if (s === focus && d.kind !== "rest") html.push(sessionHero(d, i === 0 ? "Dagens pass" : "Inför imorgon · " + fmtShort(s), i === 0, s === next));
      else html.push(dayRow(d, t, { log: i === 0, pack: s === next }));
    }
    flush();
    return html.join("");
  }
  function nudge(d) {
    return '<div class="nudge k-' + d.kind + '"><p><b>Igår: ' + esc(sessionName(d)) + (d.dist ? ", " + esc(distStr(d.dist)) : "") + ".</b> Inte loggat än.</p>" +
      '<div class="hero-actions">' + (d.dist ? '<button class="btn primary sm" data-act="quick-done" data-date="' + d.date + '">' + IC.check + "Klart</button>" : "") +
      '<button class="btn sm" data-act="quick-missed" data-date="' + d.date + '">Missade</button>' +
      '<button class="btn sm" data-act="open-session" data-date="' + d.date + '">Detaljer</button></div></div>';
  }

  function viewIdag() {
    var t = S.today, ph = phaseOf(t), wi = weekIndexOf(t), w = WEEKS[wi];
    var out = [];
    var sum = { n: 0, km: 0, m: 0 };
    for (var i = 0; i < 6; i++) {
      var sd = BY_DATE[addDays(t, i)];
      if (sd && sd.kind !== "rest") { sum.n++; if (sd.dist) sum[sd.dist.unit] += sd.dist.v; }
    }
    var parts = [sum.n + " pass"];
    if (sum.km) parts.push(nf(sum.km) + " km löpning");
    if (sum.m) parts.push(nf(sum.m) + " m simning");
    var head = '<div class="sec-h"><div><div class="eyebrow">' + (ph === "in" ? esc(w.label) + " · " + esc(w.phase) : "v." + isoWeek(t)) + "</div>" +
      '<h2 style="font-size:30px">' + esc(fmtLong(t)) + "</h2>" +
      (ph !== "post" ? '<p class="head-sub">Idag och 5 dagar framåt: ' + esc(parts.join(" · ")) + "</p>" : "") + "</div>" + (ph === "in" ? weekBadge(w) : "") + "</div>";
    out.push(head);

    var y = BY_DATE[addDays(t, -1)];
    if (y && y.kind !== "rest" && !S.logs[y.date]) out.push(nudge(y));

    var focus = ph === "in" ? focusDate(t) : null;
    if (ph === "pre") {
      var n = daysBetween(t, START);
      var first = SESSIONS[0];
      out.push('<section class="hero"><div class="hero-top"><span class="eyebrow">Programmet startar</span></div>' +
        '<div class="countdown"><div class="big">' + n + '</div><div class="what"><b>' + plural(n, "dag kvar", "dagar kvar") + "</b>till " + esc(fmtLong(START).toLowerCase()) + "</div></div>" +
        '<p class="hero-desc">' + esc(PLAN.intro.split(". Veckoplanen")[0]) + ".</p>" + (daysBetween(t, first.date) > 5 ? nextRow(first, "Första passet") : "") + "</section>");
    } else if (ph === "post") {
      var tt = totals();
      out.push('<section class="hero k-race"><div class="hero-top"><span class="eyebrow">Programmet är slut</span></div><h1 class="hero-title">Två av fyra Klassiker-lopp</h1>' +
        '<p class="hero-desc">Du genomförde ' + tt.done + " av " + TOTAL.sessions + " pass, " + nf(tt.km) + " km löpning och " + nf(tt.m / 1000) + " km simning. Nu två veckors vila innan skidträningen mot Vasaloppet.</p></section>");
    }
    if (ph !== "post") out.push('<section class="days" aria-label="Idag och 5 dagar framåt">' + dayList(t, focus) + "</section>");

    // week
    var a = weekActual(w);
    var strip = w.days.map(function (d) {
      var k = d.kind;
      return '<button class="day k-' + k + (d.date === t ? " today" : "") + '" data-act="open-session" data-date="' + d.date + '" aria-label="' + esc(fmtLong(d.date) + ": " + sessionName(d) + " " + distStr(d.dist)) + '">' +
        '<span class="wd">' + WDS[d.di] + '</span><span class="dn">' + dateOf(d.date).getDate() + '</span><span class="lane"></span><span class="code">' + KIND[k].code + "</span>" +
        (d.dist ? '<span class="v">' + nf(d.dist.v) + '</span><span class="u">' + d.dist.unit + "</span>" : '<span class="v">&nbsp;</span><span class="u">&nbsp;</span>') +
        '<span class="st">' + statusMark(d.date) + "</span></button>";
    }).join("");
    var missed = w.days.filter(function (d) { var l = S.logs[d.date]; return l && l.status === "missed"; }).length;
    out.push('<section class="sec"><div class="sec-h"><h2>' + (ph === "pre" ? "Första veckan" : ph === "post" ? "Sista veckan" : "Veckan") + '</h2><span class="sub">' +
      esc(w.label) + " · " + esc(fmtRange(w.monday)) + " · " + a.done + " av " + a.n + " pass klara</span></div>" +
      '<div class="strip">' + strip + "</div>" +
      '<div class="card meters">' +
      meter("run", "Löpning", a.km, w.runKm, "km") + meter("swim", "Simning", a.m, w.swimM, "m") + "</div>" +
      (w.focus ? '<p class="focus"><b>Veckans fokus.</b> ' + esc(w.focus) + "</p>" : "") +
      (missed ? '<div class="callout"><b>Missat pass?</b> Prioritera i den här ordningen resten av veckan:<ol><li>Långpasset</li><li>Ett simpass</li><li>Kvalitetspasset</li><li>Resten</li></ol>Gör aldrig om ett missat pass genom att dubbla nästa dag.</div>' : "") +
      "</section>");

    // races
    var r = nextRace(t);
    if (r) {
      var dn = daysBetween(t, r.date);
      out.push('<section class="sec"><div class="sec-h"><h2>Nästa lopp</h2><button class="linkish" data-act="tab" data-tab="lopp">Alla lopp</button></div>' +
        '<div class="card" style="display:flex;flex-direction:column;gap:16px"><div class="countdown"><div class="big">' + dn + '</div><div class="what"><b>' + esc(r.name) + "</b>" +
        plural(dn, "dag kvar", "dagar kvar") + " · " + esc(fmtShort(r.date)) + " · " + esc(r.dist) + "</div></div>" +
        '<div class="bibs">' + PLAN.races.map(function (x) { return bib(x, t, true); }).join("") + "</div></div></section>");
    }

    // milestone
    var ms = PLAN.milestones.filter(function (m) { return m.date >= t; })[0];
    if (ms) {
      out.push('<section class="sec"><div class="sec-h"><h2>Nästa milstolpe</h2><span class="sub">' + esc(ms.week) + " · " + esc(fmtShort(ms.date)) + "</span></div>" +
        '<div class="card mile k-' + mileKind(ms.text) + '"><span class="dot"></span><p>' + esc(ms.text) + "</p></div></section>");
    }
    return out.join("");
  }

  function meter(kind, label, done, plan, unit) {
    var pct = plan ? Math.min(100, done / plan * 100) : 0;
    return '<div class="k-' + kind + '"><div class="meter-h"><span>' + label + '</span><span class="num">' + nf(done) + " / " + nf(plan) + " " + unit + "</span></div>" +
      '<div class="meter" role="progressbar" aria-label="' + label + '" aria-valuemin="0" aria-valuemax="' + plan + '" aria-valuenow="' + done + '"><i style="width:' + pct + '%"></i></div></div>';
  }

  function raceDone(r) { var l = S.logs[r.date]; return l && l.status === "done"; }
  function bib(r, t, small) {
    var n = daysBetween(t, r.date);
    var short = r.name.replace("TCS ", "").replace("simningen", "");
    var no = raceDone(r) ? '<div class="no done">Klar</div>' : n < 0 ? '<div class="no done">' + esc(fmtDM(r.date)) + "</div>" : '<div class="no">' + n + "</div>";
    var lbl = raceDone(r) ? esc(fmtDM(r.date)) : n < 0 ? "genomfört" : n === 0 ? "idag" : plural(n, "dag", "dagar") + " · " + esc(fmtDM(r.date));
    return '<div class="bib"><div class="band">' + esc(small ? short : r.name) + "</div>" + no + '<div class="lbl">' + lbl + "</div></div>";
  }
  function mileKind(text) {
    if (/Kungsholmen|Vansbrosimningen|Lidingöloppet/.test(text)) return "race";
    if (/Testlopp/.test(text)) return "test";
    if (/öppet vatten/i.test(text)) return "open";
    if (/crawl|bassäng/.test(text)) return "swim";
    return "run";
  }

  /* ----- Plan ----- */
  function viewPlan() {
    var tt = totals(), t = S.today, cw = phaseOf(t) === "in" ? weekIndexOf(t) : -1;
    if (cw >= 0 && S.open[WEEKS[cw].id] === undefined) S.open[WEEKS[cw].id] = true;
    var out = [];
    out.push('<section class="sec"><div class="sec-h"><h2>Hela planen</h2><span class="sub">47 veckor · ' + esc(fmtDM(START)) + " 2026 – " + esc(fmtDM(END)) + " 2027</span></div>" +
      '<div class="stats">' +
      stat("Pass", tt.done, "av " + TOTAL.sessions + " pass") +
      stat("Löpning", nf(tt.km), "av " + nf(TOTAL.km) + " km") +
      stat("Simning", nf(Math.round(tt.m / 100) / 10), "av " + nf(TOTAL.m / 1000) + " km") + "</div></section>");
    out.push('<section class="sec"><div class="chart-card k-run"><div class="chart-h"><h3>Löpning, km per vecka</h3><div class="legend"><span><i class="plan"></i>Planerat</span><span><i></i>Utfört</span><span><i class="line"></i>Lopp</span></div></div><div class="chart" id="chart-run"></div></div>' +
      '<div class="chart-card k-swim"><div class="chart-h"><h3>Simning, meter per vecka</h3><div class="legend"><span><i class="plan"></i>Planerat</span><span><i></i>Utfört</span></div></div><div class="chart" id="chart-swim"></div></div>' +
      '<div class="phase-legend">' + PLAN.phases.map(function (p, i) { return '<span class="p' + i + '"><i></i>' + esc(p.name) + "</span>"; }).join("") + "</div></section>");

    PLAN.phases.forEach(function (p, pi) {
      var ws = WEEKS.filter(function (w) { return w.phase === p.name; });
      var km = ws.reduce(function (s, w) { return s + w.runKm; }, 0), m = ws.reduce(function (s, w) { return s + w.swimM; }, 0);
      out.push('<section class="phase"><div class="phase-h p' + pi + '"><span class="bar"></span><h3>' + esc(p.name) + '</h3><div class="meta">' + esc(p.period) + " · " + ws.length + " veckor · " + esc(p.perWeek) +
        " · " + nf(km) + " km löp · " + nf(m / 1000) + ' km sim</div><p class="f">' + esc(p.focus) + "</p></div>" +
        '<div class="weeks">' + ws.map(function (w) { return weekCard(w, WEEKS.indexOf(w) === cw); }).join("") + "</div></section>");
    });
    return out.join("");
  }
  function stat(l, v, of) { return '<div class="stat"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="of">' + of + "</div></div>"; }

  function weekCard(w, current) {
    var open = !!S.open[w.id], a = weekActual(w);
    var minis = w.days.map(function (d) {
      var l = S.logs[d.date];
      return '<span class="mini k-' + d.kind + (l ? " " + l.status : "") + '"></span>';
    }).join("");
    var body = "";
    if (open) {
      body = '<div class="week-body">' + (w.focus ? '<p class="focus">' + esc(w.focus) + "</p>" : "") +
        w.days.map(function (d) {
          return '<button class="drow' + (d.kind === "rest" ? " rest" : "") + '" data-act="open-session" data-date="' + d.date + '"><span class="dd"><b>' + WDS[d.di] + "</b>" + esc(fmtDM(d.date)) + "</span>" +
            '<span class="dt"><span class="n">' + esc(sessionName(d)) + (d.kind !== "rest" ? " " + chip(d.kind) : "") + "</span>" + (d.desc ? '<span class="x">' + esc(d.desc) + "</span>" : "") + "</span>" +
            '<span class="dv">' + esc(distStr(d.dist)) + statusMark(d.date) + "</span></button>";
        }).join("") + "</div>";
    }
    return '<div class="week' + (current ? " current" : "") + '" id="w-' + w.id + '" data-open="' + open + '">' +
      '<button class="week-row" data-act="toggle-week" data-week="' + w.id + '" aria-expanded="' + open + '"><span class="wn">' + esc(w.label.replace("v.", "")) + "</span>" +
      '<span class="wm"><span class="wd">' + esc(fmtRange(w.monday)) + " " + (current ? '<span class="badge">Denna vecka</span>' : "") + weekBadge(w) + '</span><span class="minis">' + minis + "</span></span>" +
      '<span class="wt"><b class="num">' + nf(w.runKm) + " km</b> · <b class=\"num\">" + nf(w.swimM) + " m</b><br>" + a.done + "/" + a.n + " klara " + IC.chev + "</span></button>" + body + "</div>";
  }

  function roundedTop(x, y, w, h, r) {
    if (h <= 0) return "";
    r = Math.min(r, w / 2, h);
    return "M" + x + "," + (y + h) + "V" + (y + r) + "Q" + x + "," + y + " " + (x + r) + "," + y + "H" + (x + w - r) + "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) + "V" + (y + h) + "Z";
  }

  function drawCharts() { drawChart("run"); drawChart("swim"); }
  function drawChart(which) {
    var host = document.getElementById("chart-" + which);
    if (!host) return;
    var isRun = which === "run";
    var W = Math.max(280, host.clientWidth), H = isRun ? 176 : 150;
    var L = 38, R = 6, T = isRun ? 24 : 10, B = 22, n = WEEKS.length;
    var iw = W - L - R, ih = H - T - B, slot = iw / n;
    var bw = Math.max(2, Math.min(24, slot - 2));
    var max = isRun ? 50 : 8000, ticks = isRun ? [0, 10, 20, 30, 40, 50] : [0, 2000, 4000, 6000, 8000];
    var unit = isRun ? "km" : "m";
    function y(v) { return T + ih - Math.min(v, max) / max * ih; }
    function x(i) { return L + i * slot + (slot - bw) / 2; }
    var s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + (isRun ? "Löpning" : "Simning") + ' per vecka, planerat och utfört">';
    PLAN.phases.forEach(function (p, pi) {
      var idx = []; WEEKS.forEach(function (w, i) { if (w.phase === p.name) idx.push(i); });
      s += '<rect class="band ph' + pi + '" x="' + (L + idx[0] * slot) + '" y="' + T + '" width="' + (idx.length * slot) + '" height="' + ih + '"/>';
    });
    ticks.forEach(function (v) {
      s += '<line class="' + (v === 0 ? "base" : "grid") + '" x1="' + L + '" x2="' + (W - R) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>';
      s += '<text x="' + (L - 6) + '" y="' + (y(v) + 3.5) + '" text-anchor="end">' + nf(v) + "</text>";
    });
    var lastMonth = -1;
    WEEKS.forEach(function (w, i) {
      var mo = dateOf(w.monday).getMonth();
      if (mo !== lastMonth) { s += '<text x="' + (L + i * slot) + '" y="' + (H - 6) + '">' + MON[mo] + "</text>"; lastMonth = mo; }
      var plan = isRun ? w.runKm : w.swimM, act = weekActual(w)[unit];
      s += '<path class="plan" d="' + roundedTop(x(i), y(plan), bw, y(0) - y(plan), 4) + '"/>';
      if (act > 0) s += '<path class="act" d="' + roundedTop(x(i), y(act), bw, y(0) - y(act), 4) + '"/>';
    });
    if (isRun) {
      PLAN.races.forEach(function (r, ri) {
        var i = weekIndexOf(r.date), cx = L + (i + .5) * slot;
        var lbl = ["Kungsholmen", "Vansbro", "Lidingö"][ri];
        s += '<line class="rl" x1="' + cx + '" x2="' + cx + '" y1="' + (T - 6) + '" y2="' + (T + ih) + '"/>';
        s += '<text class="rlt" x="' + (ri === 1 ? cx : cx - 4) + '" y="' + (T - 10) + '" text-anchor="' + (ri === 1 ? "middle" : "end") + '">' + lbl + "</text>";
      });
    }
    var cw = phaseOf(S.today) === "in" ? weekIndexOf(S.today) : -1;
    if (cw >= 0) {
      var nx = L + (cw + .5) * slot, ny = T + ih + 2;
      s += '<path class="now" d="M' + nx + "," + ny + "l4,6h-8z" + '"/>';
    }
    WEEKS.forEach(function (w, i) {
      s += '<rect class="hit" data-i="' + i + '" x="' + (L + i * slot) + '" y="' + T + '" width="' + slot + '" height="' + (ih + 8) + '"/>';
    });
    s += "</svg>";
    host.innerHTML = s + '<div class="tip" hidden></div>';
    var tip = host.querySelector(".tip");
    function show(e) {
      var el = e.target.closest(".hit"); if (!el) return;
      var i = +el.dataset.i, w = WEEKS[i], a = weekActual(w);
      host.querySelectorAll(".hit.on").forEach(function (h) { h.classList.remove("on"); });
      el.classList.add("on");
      var plan = isRun ? w.runKm : w.swimM;
      var longest = isRun ? (w.longRun ? "Långpass " + nf(w.longRun) + " km" : "") : (w.longSwim ? "Mål " + nf(w.longSwim) + " m sammanhängande" : "");
      tip.innerHTML = "<b>" + esc(w.label) + " · " + esc(fmtRange(w.monday)) + "</b><br>" + esc(w.phase) + (w.type !== "Normal" ? " · " + esc(w.type) : "") +
        "<br>Plan " + nf(plan) + " " + unit + " · utfört " + nf(a[unit]) + " " + unit + (longest ? "<br>" + esc(longest) : "");
      tip.hidden = false;
      var cx = L + (i + .5) * slot;
      var half = tip.offsetWidth / 2;
      tip.style.left = Math.max(half, Math.min(W - half, cx)) + "px";
      tip.style.top = (y(plan) - 6) + "px";
    }
    host.onpointermove = show;
    host.onpointerdown = show;
    host.onpointerleave = function () { tip.hidden = true; host.querySelectorAll(".hit.on").forEach(function (h) { h.classList.remove("on"); }); };
    host.onclick = function (e) {
      var el = e.target.closest(".hit"); if (!el) return;
      var w = WEEKS[+el.dataset.i];
      S.open[w.id] = true; render();
      var target = document.getElementById("w-" + w.id);
      if (target) target.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    };
  }

  /* ----- Lopp ----- */
  function viewLopp() {
    var t = S.today, out = [];
    var vb = PLAN.races[1], li = PLAN.races[2];
    function kl(name, sub, state, later) {
      return '<div class="kl' + (later ? " later" : "") + '"><span class="kt">' + esc(state) + '</span><span class="kn">' + esc(name) + '</span><span class="ks">' + esc(sub) + "</span></div>";
    }
    function st(r) { return raceDone(r) ? "Klar" : r.date < t ? "Ej loggad" : daysBetween(t, r.date) + " dagar kvar"; }
    out.push('<section class="sec"><div class="sec-h"><h2>En Svensk Klassiker</h2><span class="sub">Två av fyra lopp ligger i den här planen</span></div><div class="klassiker">' +
      kl("Vansbrosimningen", "3 km sim · 10 jul 2027", st(vb)) + kl("Lidingöloppet", "30 km terräng · 25 sep 2027", st(li)) +
      kl("Vasaloppet", "90 km skidor", "Nästa säsong", true) + kl("Vätternrundan", "315 km cykel", "Nästa säsong", true) + "</div></section>");

    PLAN.races.forEach(function (r, ri) {
      var lib = LIB["TAV-" + r.id];
      var extra = "";
      if (r.id === "khr") {
        var mt = maltempo();
        extra = '<div class="pace">' + (mt ?
          '<span class="eyebrow">Måltempo från testloppet</span><span class="pv">' + fmtSec(mt.lo) + "–" + fmtSec(mt.hi) + ' /km</span><span class="muted">5 km på ' + fmtSec(mt.sec) + " (" + fmtSec(mt.p5) + " /km) + 10–15 s/km. Ger sluttid " + fmtSec(mt.lo * 10) + "–" + fmtSec(mt.hi * 10) + ".</span>" :
          '<span class="eyebrow">Måltempo</span><span>Sätts av testloppet lördag 13 mars (v.10). Logga tiden på 5 km, så räknar appen ut måltempot: 5 km-tempo + 10–15 s/km.</span>' +
          '<span><button class="linkish" data-act="open-session" data-date="2027-03-13">Öppna testloppet</button></span>') + "</div>";
      }
      if (r.id === "vansbro") {
        extra = '<div class="course"><span class="eyebrow">Banan, 3 000 m</span><div class="course-bar"><div class="with">2 km medströms i Vanån →</div><div class="against">← 1 km motströms</div></div>' +
          '<div class="course-scale"><span>Start</span><span>2 000 m, in i Västerdalälven</span><span>Mål</span></div></div>' +
          '<p class="focus"><b>Packa:</b> våtdräkt, nässkydd och reserv, badmössa, glasögon.</p>';
      }
      if (r.id === "lidingo") {
        var re = /([A-ZÅÄÖ][a-zåäö]+(?: [A-ZÅÄÖ][a-zåäö]+)?) (\d+(?:,\d+)?) km före (\d\d:\d\d)/g, m, rows = "";
        while ((m = re.exec(lib.tips))) rows += "<tr><td>" + esc(m[1]) + '</td><td class="r">' + esc(m[2]) + ' km</td><td class="r">' + esc(m[3]) + "</td></tr>";
        extra = '<div class="tbl-wrap"><span class="eyebrow">Kontrolltider (klocktid)</span><table><thead><tr><th>Kontroll</th><th class="r">Distans</th><th class="r">Passera före</th></tr></thead><tbody>' + rows +
          '</tbody></table><p class="muted" style="font-size:13px;margin-top:6px">Sista startgrupp 14:30. Kontrollera årets tider på lidingoloppet.se.</p></div>' +
          '<p class="focus"><b>Kolla utrustning:</b> skor, strumpor, vätskebälte. Testa tävlingsmaten på långpassen i augusti.</p>';
      }
      var tips = r.id === "lidingo" ? lib.tips.split("Kontrolltider")[0] : lib.tips;
      out.push('<section class="race"><div class="race-head"><div><div class="eyebrow">' + esc(r.week) + " · " + (ri === 0 ? "Delmål" : ri === 1 ? "Första Klassiker-loppet" : "Andra Klassiker-loppet") + "</div><h3>" + esc(r.name) +
        '</h3><div class="rd">' + esc(fmtLong(r.date)) + " 2027 · " + esc(r.dist) + "</div></div>" + bib(r, t, false) + "</div>" +
        '<div class="race-body"><dl class="kv"><dt>Upplägg</dt><dd>' + esc(lib.upplagg) + "</dd><dt>Känsla</dt><dd>" + esc(lib.intensitet) + "</dd><dt>Tips</dt><dd>" + esc(tips) + "</dd></dl>" + extra +
        '<button class="next-row k-race" data-act="open-session" data-date="' + r.date + '"><span><span class="d">Tävlingsdagen</span><br><span class="t">' + (S.logs[r.date] ? "Se din loggning" : "Logga loppet och sluttiden") + "</span></span>" + statusMark(r.date) + "</button></div></section>");
    });

    var next = PLAN.milestones.filter(function (m) { return m.date >= t; })[0];
    out.push('<section class="sec"><div class="sec-h"><h2>Milstolpar</h2><span class="sub">' + PLAN.milestones.filter(function (m) { return m.date < t; }).length + " av " + PLAN.milestones.length + ' passerade</span></div><div class="timeline card">' +
      PLAN.milestones.map(function (m) {
        var cls = m.date < t ? "past" : m === next ? "next" : "";
        return '<div class="tl k-' + mileKind(m.text) + " " + cls + '"><div class="td"><b>' + esc(fmtDM(m.date)) + "</b>" + esc(m.week) + '</div><div class="tr"><span class="tdot"></span></div><div class="tt">' + esc(m.text) + "</div></div>";
      }).join("") + "</div></section>");
    return out.join("");
  }

  /* ----- Pass ----- */
  function viewPass() {
    var out = [];
    var rules = PLAN.principles.filter(function (p) { return !/^När en vecka spricker/.test(p) && !/^Intensitet:/.test(p); });
    var spricker = PLAN.principles.filter(function (p) { return /^När en vecka spricker/.test(p); })[0] || "";
    var prio = [], m, re = /\d\) ([^,.]+)/g;
    while ((m = re.exec(spricker))) prio.push(m[1]);
    out.push('<section class="sec"><div class="sec-h"><h2>Spelregler</h2><span class="sub">Från programmets principer</span></div>' +
      '<div class="card sec"><span class="eyebrow">När en vecka spricker, prioritera</span><div class="prio">' + prio.map(function (p) { return "<div>" + esc(cap(p)) + "</div>"; }).join("") +
      '</div><p class="muted" style="font-size:13px">Gör aldrig om ett missat pass genom att dubbla nästa dag.</p></div>' +
      '<div class="card sec"><span class="eyebrow">Intensitet och pulszoner</span><div class="zones"><span class="z z1">Z1</span><span class="z z2">Z2</span><span class="z z3">Z3</span><span class="z z4">Z4</span><span class="z z5">Z5</span>' +
      '<span class="zr" style="grid-column:2/3"><b>Lätt</b> · pratfart</span><span class="zr" style="grid-column:3/5"><b>Tempo</b> · pratsvårt</span><span class="zr" style="grid-column:4/6"><b>Intervall</b> · backar</span></div>' +
      '<p class="muted" style="font-size:13px">Använd pulszonerna i Garmin. Långpassen styrs av tid och känsla, inte tempo.</p></div>' +
      '<ul class="rules card">' + rules.map(function (p) { return "<li><span>" + esc(p) + "</span></li>"; }).join("") + "</ul></section>");

    var notOnWatch = Object.keys(WATCH.skipped).length;
    out.push('<section class="sec"><div class="sec-h"><h2>På klockan</h2><span class="sub">Inlagda i Garmin Connect ' + esc(fmtDM(WATCH.synced)) + "</span></div>" +
      '<div class="stats">' + stat("I kalendern", Object.keys(WATCH.byDate).length, "pass") + stat("Olika pass", Object.keys(WATCH.workouts).length, "namn börjar på ML") + stat("Inte på klockan", notOnWatch, "öppet vatten") + "</div>" +
      '<ul class="rules card">' + [
        ["Hitta passet:", "välj löpning eller simning på klockan, håll UP och gå till Träning > Träningskalender. Synka klockan med Garmin Connect så kommer de närmaste passen in."],
        ["Gångpauser:", "står som anteckning i långpassen. Slå på larmet för löpning/gång (Run/Walk) i löpaktivitetens inställningar, 10 min löpning och 1 min gång, så piper klockan."],
        ["Måltempo:", "passen har inget tempomål ännu. Efter testloppet 13 mars kan du lägga in tempot i Garmin Connect."],
        ["Simning:", "passen är gjorda för 25 m bassäng. Öppet vatten, Vansbro och provsimmet i älven ligger inte på klockan, så starta en simaktivitet för öppet vatten själv."]
      ].map(function (r) { return "<li><span><b>" + esc(r[0]) + "</b> " + esc(r[1]) + "</span></li>"; }).join("") + "</ul></section>");

    var groups = [
      ["Löpning", ["LL", "LK-fartlek", "LK-tempo", "LK-backar", "LK-intervall", "LK-maltempo", "LP", "LT", "TEST"]],
      ["Simning", ["SK", "SD", "SI", "SÅ", "ÖV"]]
    ];
    var kindOf = { TEST: "test", "ÖV": "open" };
    groups.forEach(function (g) {
      out.push('<section class="sec"><div class="sec-h"><h2>' + g[0] + '</h2><span class="sub">Passbibliotek</span></div><div class="libgrid">' + g[1].map(function (k) {
        var e = LIB[k], kind = kindOf[k] || (g[0] === "Löpning" ? "run" : "swim");
        var mt = k === "LK-maltempo" ? maltempo() : null;
        return '<article class="lib k-' + kind + '"><div class="lib-h"><span class="code">' + esc(e.code) + '</span><span class="cnt">' + (LIB_COUNT[k] || 0) + " " + plural(LIB_COUNT[k] || 0, "gång", "gånger") + " i planen</span></div>" +
          "<h3>" + esc(e.name.replace(/^(LÖP|SIM) /, "")) + "</h3><p>" + esc(e.syfte) + "</p>" +
          (mt ? '<p><b>Ditt måltempo:</b> ' + fmtSec(mt.lo) + "–" + fmtSec(mt.hi) + " /km</p>" : "") +
          '<details><summary>Upplägg och tips</summary><dl class="kv"><dt>Upplägg</dt><dd>' + esc(e.upplagg) + "</dd><dt>Känsla</dt><dd>" + esc(e.intensitet) + "</dd><dt>Tips</dt><dd>" + esc(e.tips) + "</dd></dl></details></article>";
      }).join("") + "</div></section>");
    });
    out.push('<section class="sec"><details class="card"><summary>Antaganden att bekräfta (' + PLAN.assumptions.length + ')</summary><ul class="rules" style="margin-top:12px">' +
      PLAN.assumptions.map(function (a) { return "<li><span>" + esc(a) + "</span></li>"; }).join("") + "</ul></details></section>");
    return out.join("");
  }

  /* ---------- sheet (session detail + log) ---------- */
  var lastFocus = null;
  function openSheet(date) { lastFocus = document.activeElement; S.sheet = date; renderSheet(); }
  function closeSheet() {
    S.sheet = null; sheetEl.hidden = true; sheetEl.innerHTML = "";
    document.body.style.overflow = "";
    if (lastFocus && lastFocus.isConnected) lastFocus.focus();
  }
  function renderSheet() {
    var d = BY_DATE[S.sheet], w = WEEKS[d.wi], lib = LIB[d.lib], l = S.logs[d.date] || {};
    var html = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' +
      '<div class="sheet-h"><span class="eyebrow">' + esc(fmtLong(d.date)) + " · " + esc(w.label) + " · " + esc(w.phase) + '</span><button class="x" data-act="close" aria-label="Stäng">' + IC.close + "</button></div>" +
      '<section class="hero k-' + d.kind + '"><div class="hero-top">' + chip(d.kind) + weekBadge(w) + '</div><h1 class="hero-title" id="sheet-title">' + esc(sessionName(d)) + "</h1>" +
      (d.desc ? '<p class="hero-desc">' + esc(d.desc) + "</p>" : "") + (d.dist ? '<div class="big">' + nf(d.dist.v) + "<small>" + d.dist.unit + "</small></div>" : "") + "</section>" + watchBlock(d);
    if (lib) {
      var mt = d.lib === "LK-maltempo" ? maltempo() : null;
      html += '<dl class="kv"><dt>Syfte</dt><dd>' + esc(lib.syfte) + "</dd><dt>Upplägg</dt><dd>" + esc(lib.upplagg) + "</dd><dt>Känsla</dt><dd>" + esc(lib.intensitet) +
        (mt ? " <b>Ditt måltempo: " + fmtSec(mt.lo) + "–" + fmtSec(mt.hi) + " /km.</b>" : "") + "</dd><dt>Tips</dt><dd>" + esc(lib.tips) + "</dd></dl>";
    }
    if (d.kind === "rest") {
      html += '<p class="focus">Vilodag. Byt gärna dag inom veckan, men ha alltid en vilodag före långpasset.</p>';
    } else {
      var timed = d.kind === "test" || d.kind === "race";
      var feelOpts = [1, 2, 3, 4, 5].map(function (n) {
        return '<input type="radio" name="feel" id="f-feel-' + n + '" value="' + n + '"' + (l.feel === n ? " checked" : "") + '><label for="f-feel-' + n + '">' + n + "</label>";
      }).join("");
      var stOpts = ["done", "partial", "missed"].map(function (k) {
        return '<input type="radio" name="status" id="f-st-' + k + '" value="' + k + '"' + (l.status === k ? " checked" : "") + '><label for="f-st-' + k + '">' + STATUS[k] + "</label>";
      }).join("");
      html += '<form class="form" id="log-form" novalidate><h3>' + (S.logs[d.date] ? "Din loggning" : "Logga passet") + "</h3>" +
        '<div class="field"><span class="fl" id="st-l">Hur gick det?</span><div class="seg" role="radiogroup" aria-labelledby="st-l">' + stOpts + "</div></div>" +
        '<div class="inrow"><div class="field"><label for="f-dist">Distans</label><div class="unit-in"><input id="f-dist" name="dist" inputmode="decimal" autocomplete="off" value="' +
        (typeof l.dist === "number" ? nf(l.dist) : d.dist ? nf(d.dist.v) : "") + '"><span>' + (d.dist ? d.dist.unit : "") + "</span></div></div>" +
        (timed ? '<div class="field"><label for="f-time">' + (d.kind === "test" ? "Tid på 5 km" : "Sluttid") + '</label><div class="unit-in"><input id="f-time" name="time" placeholder="mm:ss" autocomplete="off" value="' + esc(l.time || "") + '"><span>tid</span></div></div>' : "") +
        "</div>" +
        (d.kind === "test" ? '<p class="muted" style="font-size:13px">Skriv in tiden för själva 5 km, inte uppvärmningen. Appen räknar ut måltempot för Kungsholmen Runt.</p>' : "") +
        '<div class="field"><span class="fl" id="feel-l">Känsla</span><div class="seg five" role="radiogroup" aria-labelledby="feel-l">' + feelOpts + '</div><span class="feel-cap" id="feel-cap">' + esc(l.feel ? FEEL[l.feel] : "1 = mycket tungt, 5 = lätt och starkt") + "</span></div>" +
        '<div class="field"><label for="f-note">Anteckning</label><textarea id="f-note" name="note" placeholder="Hur kändes kroppen? Byttes passet mot något annat?">' + esc(l.note || "") + "</textarea></div>" +
        '<p class="err" id="f-err" hidden></p>' +
        '<div class="form-actions"><button type="submit" class="btn primary">' + IC.check + "Spara</button>" + (S.logs[d.date] ? '<button type="button" class="btn" data-act="clear-log">Ta bort loggning</button>' : "") + "</div></form>";
    }
    html += "</div>";
    sheetEl.innerHTML = html;
    sheetEl.hidden = false;
    document.body.style.overflow = "hidden";
    var x = sheetEl.querySelector(".x"); if (x) x.focus();
    var form = document.getElementById("log-form");
    if (form) {
      form.addEventListener("change", function (e) {
        if (e.target.name === "feel") document.getElementById("feel-cap").textContent = FEEL[+e.target.value];
        if (e.target.name === "status" && e.target.value === "missed") form.dist.value = "0";
      });
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        var err = document.getElementById("f-err");
        var st = form.querySelector("input[name=status]:checked");
        if (!st) { err.textContent = "Välj om passet blev genomfört, delvis eller missat."; err.hidden = false; return; }
        var distRaw = form.dist.value.trim().replace(/\s/g, "").replace(",", ".");
        var dist = distRaw === "" ? null : Number(distRaw);
        if (distRaw !== "" && !(dist >= 0)) { err.textContent = "Skriv distansen som en siffra, till exempel 7,5."; err.hidden = false; return; }
        var time = form.time ? form.time.value.trim() : "";
        if (time && !parseTime(time)) { err.textContent = "Skriv tiden som mm:ss eller h:mm:ss, till exempel 24:30."; err.hidden = false; return; }
        var feel = form.querySelector("input[name=feel]:checked");
        var entry = { status: st.value, dist: st.value === "missed" ? 0 : dist, feel: feel ? +feel.value : null, note: form.note.value.trim(), time: time, updated: new Date().toISOString() };
        var date = d.date, prev = S.logs[date];
        closeSheet();
        Store.put(date, entry).then(function (ok) { if (ok) toast("Sparat: " + sessionName(d) + ", " + fmtShort(date), prev ? null : function () { Store.put(date, null); }); });
      });
    }
  }

  var toastTimer = null;
  function toast(msg, undo) {
    var el = document.getElementById("toast");
    el.innerHTML = "<span>" + esc(msg) + "</span>" + (undo ? '<button type="button">Ångra</button>' : "");
    el.hidden = false;
    if (undo) el.querySelector("button").onclick = function () { el.hidden = true; undo(); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 4200);
  }

  /* ---------- backup (logs that live on one device) ---------- */
  function exportLogs() {
    var n = Object.keys(S.logs).length;
    var name = "mot-lidingo-logg-" + REAL_TODAY + ".json";
    var text = JSON.stringify({ app: "Mot Lidingö", version: 1, exported: new Date().toISOString(), logs: S.logs }, null, 1);
    function saved() {
      try { localStorage.setItem(BACKUP_KEY, REAL_TODAY); } catch (e) {}
      renderProto();
      toast("Kopian sparad: " + n + " " + plural(n, "pass", "pass"));
    }
    // Phones get the share sheet (Spara i Filer, AirDrop, mejl); computers a download.
    var file = typeof File === "function" ? new File([text], name, { type: "application/json" }) : null;
    if (file && navigator.canShare && navigator.canShare({ files: [file] }) && matchMedia("(pointer: coarse)").matches) {
      navigator.share({ files: [file], title: name }).then(saved, function (e) { if (!e || e.name !== "AbortError") toast("Kunde inte dela kopian."); });
      return;
    }
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    saved();
  }
  function cleanEntry(l) {
    if (!l || typeof l !== "object" || ["done", "partial", "missed"].indexOf(l.status) < 0) return null;
    return { status: l.status, dist: typeof l.dist === "number" && isFinite(l.dist) ? l.dist : null, feel: [1, 2, 3, 4, 5].indexOf(l.feel) >= 0 ? l.feel : null,
      note: String(l.note || "").slice(0, 2000), time: String(l.time || "").slice(0, 20), updated: String(l.updated || "") };
  }
  // A backup is merged in: for each session, whichever entry was saved last wins.
  function importLogs(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var data = null;
      try { data = JSON.parse(reader.result); } catch (e) {}
      var logs = data && data.logs && typeof data.logs === "object" ? data.logs : {}, found = 0, changed = 0;
      Object.keys(logs).forEach(function (date) {
        var l = /^\d{4}-\d\d-\d\d$/.test(date) && Object.prototype.hasOwnProperty.call(BY_DATE, date) ? cleanEntry(logs[date]) : null;
        if (!l) return;
        found++;
        var cur = S.logs[date];
        if (!cur || l.updated > (cur.updated || "")) { S.logs[date] = l; changed++; }
      });
      if (!found) { toast("Hittade inga loggade pass i filen."); return; }
      if (changed && !Store.saveLocal()) { toast("Kunde inte spara på den här enheten."); return; }
      rerender(); renderProto();
      toast(changed ? "Kopian inläst: " + changed + " " + plural(changed, "pass nytt eller ändrat", "pass nya eller ändrade") : "Kopian innehöll inget nytt.");
    };
    reader.readAsText(file);
  }

  /* ---------- events ---------- */
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) { if (e.target === sheetEl) closeSheet(); return; }
    var act = el.dataset.act;
    if (act === "tab") {
      S.tab = el.dataset.tab;
      try { history.replaceState(null, "", "#" + S.tab); } catch (err) {}
      rerender(); window.scrollTo(0, 0);
    } else if (act === "open-session") openSheet(el.dataset.date);
    else if (act === "close") closeSheet();
    else if (act === "quick-done") {
      var d = BY_DATE[el.dataset.date];
      Store.put(d.date, { status: "done", dist: d.dist ? d.dist.v : null, feel: null, note: "", time: "", updated: new Date().toISOString() }).then(function (ok) {
        if (ok) toast("Klart: " + sessionName(d) + ", " + distStr(d.dist), function () { Store.put(d.date, null); });
      });
    } else if (act === "quick-missed") {
      var dm = BY_DATE[el.dataset.date];
      Store.put(dm.date, { status: "missed", dist: null, feel: null, note: "", time: "", updated: new Date().toISOString() }).then(function (ok) {
        if (ok) toast("Missat: " + sessionName(dm) + ". Dubbla inte nästa pass.", function () { Store.put(dm.date, null); });
      });
    } else if (act === "toggle-week") { S.open[el.dataset.week] = !S.open[el.dataset.week]; render(); }
    else if (act === "clear-log") { var date = S.sheet, prev = S.logs[date]; closeSheet(); Store.put(date, null).then(function (ok) { if (ok) toast("Loggningen borttagen", function () { Store.put(date, prev); }); }); }
    else if (act === "proto") { S.protoOpen = !S.protoOpen; S.backupOpen = false; renderProto(); }
    else if (act === "backup") { S.backupOpen = !S.backupOpen; S.protoOpen = false; renderProto(); }
    else if (act === "export") exportLogs();
    else if (act === "import") document.getElementById("import-file").click();
    else if (act === "jump") { S.today = el.dataset.date; S.open = {}; S.fresh = {}; renderProto(); rerender(); }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "proto-date" && /^\d{4}-\d\d-\d\d$/.test(e.target.value)) { S.today = e.target.value; S.open = {}; S.fresh = {}; renderProto(); rerender(); }
    if (e.target.id === "import-file" && e.target.files && e.target.files[0]) importLogs(e.target.files[0]);
  });
  // The same log open in two tabs: keep both showing what was saved last.
  window.addEventListener("storage", function (e) { if (e.key === LS_KEY && Store.mode !== "db") { S.logs = Store.loadLocal(); rerender(); renderProto(); } });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.sheet) closeSheet(); });
  // Phones fire resize when the address bar slides in and out; only a new width needs new charts.
  var rt = null, lastW = window.innerWidth;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (window.innerWidth === lastW) return; lastW = window.innerWidth; if (S.tab === "plan") drawCharts(); }, 150);
  });

  // A phone keeps the page open overnight: pick up the new day, and the 20:00 switch, when it comes back.
  // render() leaves the page untouched when nothing changed, so this can run every minute.
  function syncClock() {
    var now = isoOf(new Date());
    if (now !== REAL_TODAY) {
      if (S.today === REAL_TODAY) S.today = now;
      REAL_TODAY = now; renderProto();
    }
    rerender();
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) { S.fresh = {}; syncClock(); } });
  setInterval(syncClock, 60000);

  S.logs = Store.loadCache() || Store.loadLocal();
  renderProto();
  rerender();
  Store.connect();
})();
</script>
<script>if ("serviceWorker" in navigator) addEventListener("load", function () { navigator.serviceWorker.register("sw.js"); });</script>
</body></html>
